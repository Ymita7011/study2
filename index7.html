<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家庭科 期末テストクイズ</title>

<style>
body{
    font-family:sans-serif;
    max-width:900px;
    margin:auto;
    padding:20px;
    background:#f5f7fb;
}

h1{
    text-align:center;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

button{
    padding:10px 20px;
    margin:5px;
    cursor:pointer;
}

.choice{
    display:block;
    width:100%;
    text-align:left;
    margin:10px 0;
}

.correct{
    background:#c8f7c5;
}
.wrong{
    background:#ffcdd2;
}

#result{
    font-size:24px;
    text-align:center;
}
</style>
</head>

<body>

<h1>家庭科 期末テストクイズ</h1>

<div class="card">

<div id="start">

<h2>問題数を選んでください</h2>

<button onclick="startQuiz(5)">5問</button>
<button onclick="startQuiz(10)">10問</button>
<button onclick="startQuiz(15)">15問</button>

</div>

<div id="quiz" style="display:none">
<h2 id="counter"></h2>
<p id="question"></p>
<div id="choices"></div>
</div>

<div id="result" style="display:none"></div>

</div>

a:["方向性","順序性","個人差","反射"],

{

a:["方向性","順序性","反射","遺伝"],

a:["個人差","順番が決まっていること","方向のこと","性格のこと"],
c:1

{

a:["立つ→座る→首がすわる",
"首がすわる→座る→立つ",
"座る→立つ→首がすわる",
"立つ→首がすわる→座る"],
c:1
},
{
q:"発達には何がある？",
a:["絶対同じ","個人差","例外なし","決まりなし"],
c:1
},
{
q:"幼児理解で大切なのは？",
a:["全員同じ成長を期待する",
"個人差を理解する",
"競争させる",
"比較する"],
c:1
}
];

let questions=[];
let current=0;
let score=0;

function startQuiz(count){

questions=[...allQuestions]
.sort(()=>Math.random()-0.5)
.slice(0,count);

document.getElementById("start").style.display="none";
document.getElementById("quiz").style.display="block";

showQuestion();
}

function showQuestion(){

let q=questions[current];

document.getElementById("counter").textContent=
`${current+1}/${questions.length}`;

document.getElementById("question").textContent=q.q;

let html="";

q.a.forEach((choice,index)=>{

html+=`
<button class="choice"
onclick="answer(${index})">
${choice}
</button>
`;

});

document.getElementById("choices").innerHTML=html;
}

function answer(index){

const q=questions[current];

if(index===q.c){
score++;
}

current++;

if(current<questions.length){
showQuestion();
}
else{
finishQuiz();
}
}

function finishQuiz(){

document.getElementById("quiz").style.display="none";

document.getElementById("result").style.display="block";

document.getElementById("result").innerHTML=
`
<h2>結果</h2>
<p>${questions.length}問中 ${score}問正解</p>
<button onclick="location.reload()">
もう一度挑戦
</button>
`;
}

</script>
