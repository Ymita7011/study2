<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美術科定期テスト対策：美術史・建築・彫刻総合クイズ</title>
    <style>
        :root {
            /* トリコロールカラー */
            --tricolour-blue: #0033a0;
            --tricolour-red: #e4002b;
            --tricolour-white: #ffffff;
            --bg-color: #f0f4f8;
            --text-color: #1a202c;
            --border-gray: #cbd5e1;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            background-color: var(--tricolour-white);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 51, 160, 0.1);
            padding: 35px 30px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            box-sizing: border-box;
            border-top: 8px solid var(--tricolour-blue);
            border-bottom: 8px solid var(--tricolour-red);
        }
        h1 {
            color: var(--tricolour-blue);
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 8px;
            font-weight: 800;
        }
        p.subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }
        .btn {
            background-color: var(--tricolour-blue);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin: 5px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #002266;
        }
        .btn-select {
            background-color: #f1f5f9;
            color: #475569;
            border: 2px solid var(--border-gray);
            font-size: 14px;
            padding: 10px 16px;
        }
        .btn-select.active {
            background-color: var(--tricolour-red);
            color: white;
            border-color: var(--tricolour-red);
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        .question-box {
            font-size: 18px;
            font-weight: bold;
            background: #f8fafc;
            padding: 20px;
            border-left: 6px solid var(--tricolour-blue);
            border-radius: 0 8px 8px 0;
            margin-bottom: 25px;
            line-height: 1.6;
            text-align: left;
        }
        .answer-box {
            display: none;
            background: #fff5f5;
            border: 2px solid var(--tricolour-red);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            text-align: left;
        }
        .answer-box.active {
            display: block;
        }
        .answer-item {
            margin-bottom: 12px;
            font-size: 15px;
            line-height: 1.4;
        }
        .answer-item:last-child {
            margin-bottom: 0;
        }
        .answer-item strong {
            color: var(--tricolour-blue);
            display: inline-block;
            width: 90px;
        }
        .self-check-area {
            display: none;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }
        .self-check-area.active {
            display: flex;
        }
        .result-list {
            max-height: 280px;
            overflow-y: auto;
            text-align: left;
            margin-bottom: 25px;
            border: 1px solid var(--border-gray);
            border-radius: 8px;
            padding: 10px;
            background: #f8fafc;
        }
        .result-item {
            padding: 10px 8px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 13px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
<div class="container">
    <!-- 1. スタート画面 -->
    <div id="start-screen" class="screen active">
        <h1>美術科 定期テスト対策</h1>
        <p class="subtitle">建築・彫刻・美術史 総合問題集</p>
        
        <p style="font-weight: 600; color: #475569; margin-bottom: 10px; text-align: left;">出題数を選択してください</p>
        <div style="margin-bottom: 35px; text-align: left;">
            <button class="btn btn-select active" onclick="setCount(5, this)">5問</button>
            <button class="btn btn-select" onclick="setCount(10, this)">10問</button>
            <button class="btn btn-select" onclick="setCount(15, this)">15問</button>
            <button class="btn btn-select" onclick="setCount(20, this)">20問</button>
        </div>
        
        <button class="btn" style="font-size: 18px; padding: 15px 50px; background-color: var(--tricolour-red); width: 100%;" onclick="startQuiz()">クイズスタート！</button>
    </div>

    <!-- 2. クイズ解答画面 -->
    <div id="quiz-screen" class="screen">
        <div style="display:flex; justify-content:space-between; font-size:13px; color:#64748b; margin-bottom:15px; font-weight:600;">
            <span id="question-number">第 1 問</span>
            <span id="score-progress">合っていた: 0</span>
        </div>
        
        <div id="question-text" class="question-box"></div>
        
        <button id="show-answer-btn" class="btn" style="width: 100%; padding: 15px;" onclick="revealAnswer()">頭の中で答えてから「答えを見る」</button>
        
        <div id="answer-box" class="answer-box">
            <div class="answer-item"><strong>📌 作品名:</strong> <span id="ans-title"></span></div>
            <div class="answer-item"><strong>👤 作者:</strong> <span id="ans-artist"></span></div>
            <div class="answer-item"><strong>📍 所蔵場所:</strong> <span id="ans-location"></span></div>
            <div id="notes-item" class="answer-item"><strong>💡 備考特長:</strong> <span id="ans-notes"></span></div>
        </div>
        
        <div id="self-check-area" class="self-check-area">
            <button class="btn" style="background-color: #2ecc71; flex: 1;" onclick="submitScore(true)">合っていた ⭕️</button>
            <button class="btn" style="background-color: var(--tricolour-red); flex: 1;" onclick="submitScore(false)">間違っていた ❌</button>
        </div>
    </div>

    <!-- 3. 結果画面 -->
    <div id="result-screen" class="screen">
        <h1>テスト終了！</h1>
        <div id="score-summary" style="font-size: 18px; margin: 20px 0; font-weight: bold; line-height: 1.6;"></div>
        
        <p style="text-align: left; font-weight: bold; color: #475569; margin-bottom: 5px;">今回の結果と正解データ：</p>
        <div id="result-list" class="result-list"></div>
        
        <button class="btn" style="background-color: var(--tricolour-blue); width: 100%; padding: 12px;" onclick="backToTop()">TOPに戻る</button>
    </div>
</div>
<script>
// CSVデータ（全33件）
const masterArtData = [
  { title: "薬師寺東塔", artist: "-", location: "奈良県", notes: "-" },
  { title: "浄土寺浄土堂", artist: "-", location: "兵庫", notes: "-" },
  { title: "天壇祈年殿", artist: "-", location: "中国", notes: "-" },
  { title: "東大寺南大門", artist: "-", location: "奈良県", notes: "-" },
  { title: "金剛力士像", artist: "運慶", location: "東大寺南大門（奈良）", notes: "-" },
  { title: "ピサ大聖堂", artist: "-", location: "イタリア", notes: "-" },
  { title: "ランス大聖堂", artist: "-", location: "フランス", notes: "-" },
  { title: "ベルサイユ宮殿オランジュリー", artist: "-", location: "フランス", notes: "-" },
  { title: "受胎告知", artist: "-", location: "フランス", notes: "-" },
  { title: "アフメディエ（アハメディエ）", artist: "-", location: "トルコ", notes: "-" },
  { title: "アンコールワット", artist: "-", location: "カンボジア", notes: "-" },
  { title: "真夢", artist: "安田侃", location: "イタリアミラノ", notes: "-" },
  { title: "青銅時代", artist: "ロダン", location: "国立西洋美術館", notes: "-" },
  { title: "女", artist: "荻原守衛", location: "東京国立近代美術館", notes: "-" },
  { title: "三つ編みのディナ", artist: "アリスティド・マイヨール", location: "姫路美術館", notes: "-" },
  { title: "雪の上の影", artist: "船越桂", location: "札幌芸術の森美術館", notes: "-" },
  { title: "二つに分けられた横たわる像・カット", artist: "ヘンリー・ムーア", location: "彫刻の森美術館", notes: "-" },
  { title: "空間の中の鳥", artist: "コンスタンティン・ブランクーシ", location: "ニューヨーク近代美術館", notes: "-" },
  { title: "空間の中の一つの連続する形", artist: "ウンベルトボッチョーニ", location: "彫刻の森美術館", notes: "-" },
  { title: "タイルの壁にもたれる東洋の女", artist: "ジョージ・シーガル", location: "徳島県立近代美術館", notes: "-" },
  { title: "指さす人", artist: "アルベルト・ジャコメッティ", location: "テート（イギリス）", notes: "-" },
  { title: "赤い噴水", artist: "アレクサンダー・コールダー", location: "兵庫県立美術館", notes: "-" },
  { title: "ニテロイ現代美術館", artist: "オスカー・ニーマイヤー", location: "ニテロイ市", notes: "宇宙船っぽいけど周囲の自然になじんでる。建築家は花をイメージ。" },
  { title: "セントメリーアックス３０", artist: "ノーマン・フォスター", location: "ロンドン", notes: "ガーキンという愛称。普通のビルに比べ環境配慮ができており節電されている" },
  { title: "白川郷の合掌造り集落", artist: "-", location: "岐阜県", notes: "-" },
  { title: "自然環境に適応した高床の家", artist: "-", location: "インドネシア", notes: "-" },
  { title: "紙の大聖堂", artist: "坂茂", location: "クライストチャーチ", notes: "-" },
  { title: "三徳山三佛寺 奥院", artist: "-", location: "鳥取", notes: "もともと修行の場。信仰の対象として引き立てられている。" },
  { title: "棚田", artist: "-", location: "福岡県うきは市", notes: "-" },
  { title: "フンデルトヴァッサーハウス", artist: "フリーデンスライヒ・フンデルトヴァッサー", location: "ウィーン", notes: "-" },
  { title: "ウインドキャラバン", artist: "新宮晋", location: "モトゥコレア（ニュージーランド）", notes: "-" },
  { title: "浮かぶ彫刻 3", artist: "マルタ・パン", location: "彫刻の森美術館（神奈川県）", notes: "-" },
  { title: "ブラック・スライド・マントラ", artist: "イサム・ノグチ", location: "北海道札幌市（大通公園）", notes: "-" }
];

let selectedCount = 5;
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let quizHistory = [];

function setCount(count, element) {
    selectedCount = count;
    element.parentNode.querySelectorAll('.btn-select').forEach(btn => btn.classList.remove('active'));
    element.classList.add('active');
}

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function startQuiz() {
    let shuffled = shuffle([...masterArtData]);
    currentQuestions = shuffled.slice(0, selectedCount);
    currentIndex = 0;
    score = 0;
    quizHistory = [];
    
    document.getElementById('start-screen').classList.remove('active');
    document.getElementById('quiz-screen').classList.add('active');
    showQuestion();
}

function showQuestion() {
    let q = currentQuestions[currentIndex];
    document.getElementById('question-number').innerText = `第 ${currentIndex + 1} 問 / 全 ${selectedCount} 問`;
    document.getElementById('score-progress').innerText = `合っていた: ${score}`;
    document.getElementById('answer-box').classList.remove('active');
    document.getElementById('self-check-area').classList.remove('active');
    document.getElementById('show-answer-btn').style.display = 'block';
    
    let qText = `【作品・建築名】<br><strong style="font-size:22px; color:var(--tricolour-blue);">${q.title}</strong><br><br>の「作者」「所蔵場所」は何でしょう？`;
    
    if (q.notes !== "-") {
        qText += `<br><br><span style="font-size:14px; color:#64748b; font-weight:normal;">💡 ヒント（特徴）：${q.notes}</span>`;
    }
    
    document.getElementById('question-text').innerHTML = qText;
    
    document.getElementById('ans-title').innerText = q.title;
    document.getElementById('ans-artist').innerText = q.artist;
    document.getElementById('ans-location').innerText = q.location;
    document.getElementById('ans-notes').innerText = q.notes;
    
    if(q.notes === "-") {
        document.getElementById('notes-item').style.display = 'none';
    } else {
        document.getElementById('notes-item').style.display = 'block';
    }
}

function revealAnswer() {
    document.getElementById('show-answer-btn').style.display = 'none';
    document.getElementById('answer-box').classList.add('active');
    document.getElementById('self-check-area').classList.add('active');
}

function submitScore(isCorrect) {
    let q = currentQuestions[currentIndex];
    if(isCorrect) score++;
    
    quizHistory.push({
        title: q.title,
        artist: q.artist,
        location: q.location,
        isCorrect: isCorrect
    });
    
    currentIndex++;
    if(currentIndex < selectedCount) {
        showQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById('quiz-screen').classList.remove('active');
    document.getElementById('result-screen').classList.add('active');
    
    let rate = Math.round((score / selectedCount) * 100);
    document.getElementById('score-summary').innerHTML = `
        出題数: ${selectedCount} 問 / 正解数: ${score} 問<br>
        <span style="color:var(--tricolour-red); font-size:24px;">正答率: ${rate}%</span>
    `;
    
    let listArea = document.getElementById('result-list');
    listArea.innerHTML = '';
    
    quizHistory.forEach((item, idx) => {
        let div = document.createElement('div');
        div.className = 'result-item';
        div.innerHTML = `
            <div style="display:flex; justify-content:space-between; font-weight:bold;">
                <span>第${idx+1}問: ${item.title}</span>
                <span style="color:${item.isCorrect ? '#2ecc71' : 'var(--tricolour-red)'}">
                    ${item.isCorrect ? '⭕️ 正解' : '❌ 不正解'}
                </span>
            </div>
            <div style="color:#64748b; margin-top:4px; font-size:12px;">
                作者: ${item.artist} / 場所: ${item.location}
            </div>
        `;
        listArea.appendChild(div);
    });
}

function backToTop() {
    document.getElementById('result-screen').classList.remove('active');
    document.getElementById('start-screen').classList.add('active');
}
</script>
</body>
</html>
