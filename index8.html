<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>技術科クイズ</title>

<style>
body{
    font-family:sans-serif;
    text-align:center;
    background:#f5f5f5;
    margin:0;
    padding:20px;
}

.container{
    background:white;
    max-width:800px;
    margin:auto;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

button{
    padding:10px 20px;
    margin:10px;
    font-size:16px;
    cursor:pointer;
}

.choice{
    display:block;
    width:90%;
    margin:10px auto;
}

.correct{
    color:green;
    font-size:24px;
}

.wrong{
    color:red;
    font-size:24px;
}
</style>
</head>

<body>

<div class="container">

<div id="start">

<h1>技術科 期末テストクイズ</h1>

<p>問題数を選択してください</p>

<button onclick="startQuiz(5)">5問</button>
<button onclick="startQuiz(10)">10問</button>
<button onclick="startQuiz(15)">15問</button>

</div>

<div id="quiz" style="display:none;">
<h2 id="count"></h2>
<h3 id="question"></h3>

<div id="choices"></div>

<div id="result"></div>
</div>

<div id="finish" style="display:none;">
<h2>終了！</h2>

<p id="score"></p>

<button onclick="location.reload()">TOPへ戻る</button>

</div>

</div>

{

{

c:["セキュリティ対策ソフト","表計算ソフト","動画編集ソフト","ペイント"],
a:0

{

c:["情報拡散","停電","印刷不良","画面割れ"],
a:0
},
{

c:["情報サービス","情報漏洩","誤情報","攻撃"],
a:0
},
{
q:"著作権法違反の動画公開は？",
c:["問題がある","推奨される","安全","合法"],
a:0
},
{
q:"情報モラルで重要なのは？",
c:["適切な行動","無断転載","誹謗中傷","改ざん"],
a:0
},
{
q:"サーバを識別する名前は？",
c:["ドメイン名","パス名","WiFi","LAN"],
a:0
},
{

c:["パス名","ドメイン名","プロトコル","ISP"],
a:0
}

];

let questions=[];
let total=0;
let current=0;
let score=0;

function shuffle(arr){
 return arr.sort(()=>Math.random()-0.5);
}

function startQuiz(num){

 total=num;

 questions=shuffle([...questionPool]).slice(0,num);

 document.getElementById("start").style.display="none";
 document.getElementById("quiz").style.display="block";

 showQuestion();
}

function showQuestion(){

 document.getElementById("result").innerHTML="";

 let q=questions[current];

 document.getElementById("count").innerHTML=
 `${current+1} / ${total}`;

 document.getElementById("question").innerHTML=q.q;

 let html="";

 q.c.forEach((choice,index)=>{

   html+=`
   <button class="choice"
   onclick="answer(${index})">
   ${choice}
   </button>`;
 });

 document.getElementById("choices").innerHTML=html;
}

function answer(index){

 let q=questions[current];

 const result=document.getElementById("result");

 if(index===q.a){
   score++;
   result.innerHTML='<p class="correct">○ 正解！</p>';
 }else{
   result.innerHTML=
   `<p class="wrong">× 不正解<br>
   正解：${q.c[q.a]}</p>`;
 }

 document.getElementById("choices").innerHTML="";

 setTimeout(()=>{

   current++;

   if(current>=total){
      finishQuiz();
   }else{
      showQuestion();
   }

 },1200);

}

function finishQuiz(){

 document.getElementById("quiz").style.display="none";
 document.getElementById("finish").style.display="block";

 let rate=Math.round(score/total*100);

 document.getElementById("score").innerHTML=
 `正解数 ${score}/${total}<br>
 正答率 ${rate}%`;
}

</script>

</html>
