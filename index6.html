<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夏草クイズ</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'BIZ UDPGothic', sans-serif;
            background-color: #f0f7f4;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #quiz-container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }
        h2 {
            color: #2e7d32;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #388e3c;
        }
        #result {
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div id="quiz-container">
    <div id="quiz">
        <h2 id="question">問題を読み込んでいます...</h2>
        <div id="options"></div>
    </div>
    <div id="result"></div>
</div>

<script>
    const quizData = [
        {
            question: "俳句「夏草や 兵どもが 夢のあと」を詠んだ詩人は誰？",
            options: ["松尾芭蕉", "与謝蕪村", "正岡子規", "小林一茶"],
            answer: 0
        },
        {
            question: "「夏草」が季語として表す季節はいつ？",
            options: ["春", "夏", "秋", "冬"],
            answer: 1
        },
        {
            question: "芭蕉がこの句を詠んだとされる、平泉の有名な遺跡はどれ？",
            options: ["中尊寺", "毛越寺", "金剛堂", "高館義経堂"],
            answer: 3
        }
    ];

    let currentQuiz = 0;
    let score = 0;

    const questionEl = document.getElementById("question");
    const optionsEl = document.getElementById("options");
    const resultEl = document.getElementById("result");

    function loadQuiz() {
        deselectAnswers();
        const currentQuizData = quizData[currentQuiz];
        questionEl.innerText = `${currentQuiz + 1}. ${currentQuizData.question}`;
        
        currentQuizData.options.forEach((option, index) => {
            const button = document.createElement("button");
            button.innerText = option;
            button.classList.add("btn");
            button.addEventListener("click", () => selectAnswer(index));
            optionsEl.appendChild(button);
        });
    }

    function deselectAnswers() {
        optionsEl.innerHTML = "";
    }

    function selectAnswer(index) {
        if (index === quizData[currentQuiz].answer) {
            score++;
        }
        currentQuiz++;
        if (currentQuiz < quizData.length) {
            loadQuiz();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById("quiz").style.display = "none";
        resultEl.innerText = `クイズ終了！ あなたのスコアは ${quizData.length}問中 ${score}問正解です。`;
    }

    loadQuiz();
</script>

</body>
</html>
