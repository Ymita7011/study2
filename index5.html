<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中3古文・国語対策：三大和歌集クイズ</title>
    <style>
        /* トリコロールカラー（紺・白・赤）のベースデザイン */
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
            background-color: #f0f4f8;
            color: #1a2530;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 90vh;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #ffffff; /* 白 */
            padding: 30px;
            border-radius: 12px;
            border-top: 8px solid #0f2c59; /* 紺 */
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #0f2c59; /* 紺 */
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 25px;
            padding-bottom: 12px;
            border-bottom: 2px dashed #0f2c59;
        }
        .quiz-box {
            display: none;
        }
        .active {
            display: block;
        }
        .question-num {
            font-weight: bold;
            color: #d92027; /* 赤 */
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .category-tag {
            display: inline-block;
            background-color: #0f2c59; /* 紺 */
            color: #ffffff;
            font-size: 12px;
            padding: 4px 10px;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .question-text {
            font-size: 18px;
            font-weight: bold;
            line-height: 1.5;
            margin-bottom: 25px;
        }
        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .option-btn {
            width: 100%;
            background: #ffffff;
            border: 2px solid #0f2c59; /* 紺 */
            color: #0f2c59;
            padding: 14px 20px;
            margin-bottom: 14px;
            border-radius: 8px;
            text-align: left;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .option-btn:hover {
            background: #0f2c59; /* 紺に反転 */
            color: #ffffff;
        }
        .result-screen {
            text-align: center;
        }
        .score {
            font-size: 36px;
            font-weight: bold;
            color: #d92027; /* 赤 */
            margin: 25px 0;
        }
        .restart-btn {
            background: #d92027; /* 赤 */
            color: #ffffff;
            border: none;
            padding: 14px 35px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        .restart-btn:hover {
            background: #b3171e;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📝 三大和歌集 定期テスト対策クイズ</h1>

    <!-- クイズ画面 -->
    <div id="quiz-screen" class="quiz-box active">
        <div id="question-number" class="question-num"></div>
        <div id="category-tag" class="category-tag"></div>
        <div id="question-text" class="question-text"></div>
        <ul id="options-container" class="options-list"></ul>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="quiz-box result-screen">
        <h2>採点結果</h2>
        <div class="score"><span id="correct-count">0</span> / <span id="total-count">0</span> 問正解</div>
        <p id="evaluation-message" style="font-size: 16px; margin-bottom: 30px; line-height: 1.6;"></p>
        <button class="restart-btn" onclick="restartQuiz()">もう一度挑戦する</button>
    </div>
</div>

<script>
    // 提供されたまとめデータに基づく問題セット
    const quizData = [
        {
            category: "万葉集",
            question: "『万葉集』が成立した時代として正しいものを選びなさい。",
            options: ["奈良時代末期（759年以降）", "平安時代前期（905年頃）", "鎌倉時代初期（1205年）", "室町時代"],
            answer: 0
        },
        {
            category: "古今和歌集",
            question: "醍醐天皇の命によって作られた、最初の「勅撰和歌集」の名前を選びなさい。",
            options: ["万葉集", "古今和歌集", "新古今和歌集", "八代集"],
            answer: 1
        },
        {
            category: "新古今和歌集",
            question: "『新古今和歌集』の主な編者であり、のちの古典文学に大きな影響を与えた人物は誰ですか。",
            options: ["大伴家持", "紀貫之", "藤原定家", "後鳥羽上皇"],
            answer: 2
        },
        {
            category: "万葉集",
            question: "『万葉集』の収録歌数として正しいものを選びなさい。",
            options: ["約1,100首（全20巻）", "約2,000首（全20巻）", "約4,500首（全20巻）", "約10,000首（全10巻）"],
            answer: 2
        },
        {
            category: "古今和歌集",
            question: "『古今和歌集』の歌風（特徴）を表す言葉として、最も適切なものを選びなさい。",
            options: ["万葉調（ますらをぶり）", "古今調（たおやめぶり）", "新古今調（幽玄）", "写実的で力強い気風"],
            answer: 1
        },
        {
            category: "新古今和歌集",
            question: "過去の有名な古い歌の一部を引用して新しい歌を作る、『新古今和歌集』で多用された表現技巧を何と言いますか。",
            options: ["掛詞（かけことば）", "縁語（えんご）", "枕詞（まくらことば）", "本歌取り（ほんかどり）"],
            answer: 3
        },
        {
            category: "万葉集",
            question: "『万葉集』が書かれた際の特徴的な表記方法で、漢字を日本語の音に当てはめて表現したものを何と言いますか。",
            options: ["万葉仮名", "ひらがな", "カタカナ", "草書体"],
            answer: 0
        },
        {
            category: "和歌集の比較",
            question: "歌集の「詠み手の範囲」について、天皇から防人・農民にいたるまで最も幅広い階層の歌が収められている歌集はどれですか。",
            options: ["万葉集", "古今和歌集", "新古今和歌集", "すべて同じ"],
            answer: 0
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;

    function loadQuestion() {
        const currentQuiz = quizData[currentQuestionIndex];
        
        // テキストの流し込み
        document.getElementById('question-number').innerText = `Question ${currentQuestionIndex + 1}`;
        document.getElementById('category-tag').innerText = currentQuiz.category;
        document.getElementById('question-text').innerText = currentQuiz.question;
        
        // 選択肢の生成
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        currentQuiz.options.forEach((option, index) => {
            const li = document.createElement('li');
            li.innerHTML = `<button class="option-btn" onclick="checkAnswer(${index})">${option}</button>`;
            optionsContainer.appendChild(li);
        });
    }

    function checkAnswer(selectedIndex) {
        const currentQuiz = quizData[currentQuestionIndex];
        
        if (selectedIndex === currentQuiz.answer) {
            alert("⭕ 正解です！");
            score++;
        } else {
            alert(`❌ 不正解...\n正解は「${currentQuiz.options[currentQuiz.answer]}」でした。`);
        }

        currentQuestionIndex++;

        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('quiz-screen').classList.remove('active');
        document.getElementById('result-screen').classList.add('active');
        
        document.getElementById('correct-count').innerText = score;
        document.getElementById('total-count').innerText = quizData.length;

        let message = "";
        const rate = score / quizData.length;
        if (rate === 1) {
            message = "パーフェクト！🎉 三大和歌集の基礎知識は完璧です。自信を持ってテストに臨みましょう！";
        } else if (rate >= 0.7) {
            message = "高得点です！👍 間違えた項目の「成立時代」「編者」「歌風」をもう一度表で確認しておきましょう。";
        } else {
            message = "まずは表の「ポイント」から見直してみましょう。特に『万葉仮名』や『本歌取り』などのキーワードが出題されやすいです！";
        }
        document.getElementById('evaluation-message').innerText = message;
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        document.getElementById('result-screen').classList.remove('active');
        document.getElementById('quiz-screen').classList.add('active');
        loadQuestion();
    }

    // 初回起動
    loadQuestion();
</script>

</body>
</html>
